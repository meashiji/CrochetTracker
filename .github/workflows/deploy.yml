name: Deploy to Fly.io

on:
  push:
    branches: [main]

jobs:
  migration-drift-check:
    name: Migration drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crochet_tracker_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # app.config requires these at import time; dummy values suffice for
      # alembic upgrade/check (no mail is sent, no sessions are signed).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crochet_tracker_check
      SECRET_KEY: ci-migration-drift-check
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci
      MAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen --no-dev
      # A fresh database at head = "all migrations applied". `alembic check`
      # then fails the job if SQLModel metadata wants anything more — i.e. a
      # model changed without a migration.
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crochet_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py only setdefault()s DATABASE_URL, so this wins and points
      # the suite at the service below. The +asyncpg driver suffix is required:
      # conftest builds its engine from this var raw, without app.config's
      # postgresql:// -> postgresql+asyncpg:// rewrite.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/crochet_tracker_test
      SECRET_KEY: ci-tests
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci
      MAIL_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    name: Deploy
    needs: [migration-drift-check, test]
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
