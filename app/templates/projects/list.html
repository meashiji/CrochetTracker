{% extends "base.html" %}

{% block content %}
<h1>My Projects</h1>
<p><a href="/projects/new">New project</a></p>
{% if projects %}
<ul>
    {% for project in projects %}
    <li><a href="/projects/{{ project.id }}">{{ project.name }}</a></li>
    {% endfor %}
</ul>
{% else %}
<p>No projects yet — <a href="/projects/new">create one</a>.</p>
{% endif %}
{% endblock %}
