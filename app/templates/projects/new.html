{% extends "base.html" %}

{% block content %}
<section class="panel">
    <p class="eyebrow">New project</p>
    <h1>Start a new crochet project</h1>
    <p class="lead">Give your project a name and begin building your creative plan.</p>

    {% if error %}<p style="color: #a44f62">{{ error }}</p>{% endif %}

    <form method="post" action="/projects/new">
        <label>Project name
            <input name="name" required autofocus maxlength="50" placeholder="e.g. Sunset shawl">
        </label>
        <button type="submit">Create project</button>
    </form>

    <p class="subtle"><a href="/projects/">Back to projects</a></p>
</section>
{% endblock %}
