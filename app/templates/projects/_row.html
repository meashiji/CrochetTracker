{% set row_state = row_progress[row.id] %}
{% set state = row_state.state %}
{% set glyph = {"not_started": "○", "in_progress": "◐", "done": "●"}[state.value] %}
{% set is_current = current_row_id is defined and row.id == current_row_id %}
<li id="row-{{ row.id }}" class="row-item row-item--{{ state.value }}{{ ' row-item--current' if is_current else '' }}{{ ' row-item--error' if stitch_error else '' }}">
    <button type="button"
        class="row-toggle"
        hx-post="/projects/{{ project.id }}/elements/{{ element.id }}/reps/{{ rep_number }}/rows/{{ row.id }}/state"
        hx-target="closest li"
        hx-swap="outerHTML"
        hx-on::responseError="this.closest('li').classList.add('row-item--error')"
        aria-label="Mark row {{ row.position }} as next state">
        <span class="row-dot">{{ glyph }}</span>{{ row.content }}
    </button>
    {% if state.value == "in_progress" %}
    <label class="row-stitch">stitch
        <input type="text" name="stitch_position" inputmode="numeric" pattern="[0-9]*" value="{{ row_state.stitch_position or '' }}"
            hx-post="/projects/{{ project.id }}/elements/{{ element.id }}/reps/{{ rep_number }}/rows/{{ row.id }}/stitch"
            hx-trigger="change"
            hx-target="closest li"
            hx-swap="outerHTML"
            hx-on::responseError="this.closest('li').classList.add('row-item--error')"
            aria-label="Stitch position for row {{ row.position }}">
    </label>
    {% endif %}
</li>
