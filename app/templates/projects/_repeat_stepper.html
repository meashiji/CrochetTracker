<div class="repeat-stepper" aria-label="Repeat count">
    {% if element.repeat_count > 1 %}
    <form hx-post="/projects/{{ project.id }}/elements/{{ element.id }}/repeat-count"
        hx-target="closest .repeat-stepper"
        hx-swap="outerHTML"
        {% if has_rows %}onsubmit="if (!confirm('Decreasing the repeat count will delete the highest-numbered reps and all their progress. Continue?')) return false;"{% endif %}>
        <input type="hidden" name="repeat_count" value="{{ element.repeat_count - 1 }}">
        <button type="submit" aria-label="Decrease repeat count">−</button>
    </form>
    {% endif %}
    <span class="repeat-stepper-count">×{{ element.repeat_count }}</span>
    {% if element.repeat_count < 99 %}
    <form hx-post="/projects/{{ project.id }}/elements/{{ element.id }}/repeat-count"
        hx-target="closest .repeat-stepper"
        hx-swap="outerHTML"
        onsubmit="return true;">
        <input type="hidden" name="repeat_count" value="{{ element.repeat_count + 1 }}">
        <button type="submit" aria-label="Increase repeat count">+</button>
    </form>
    {% endif %}
</div>

<!-- Out-of-band: rep pills — swapped into #rep-pills in the element detail page -->
<nav id="rep-pills" class="rep-pills {{ '' if element.repeat_count > 1 else 'is-hidden' }}"
    aria-label="Repetitions" hx-swap-oob="outerHTML">
    {% for n in rep_numbers %}
    <a href="?rep={{ n }}" class="rep-pill{{ ' rep-pill--active' if n == rep_number }}">Rep {{ n }}</a>
    {% endfor %}
</nav>
