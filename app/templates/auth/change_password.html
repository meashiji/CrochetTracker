{% extends "base.html" %}

{% block content %}
    <h1>Change password</h1>
    {% if error %}
        <p id="change-password-error" class="auth-error form-error" aria-live="polite">{{ error }}</p>
    {% endif %}
    {% if success %}
        <p id="change-password-success" class="auth-error form-success" aria-live="polite">{{ success }}</p>
    {% endif %}
    <form action="/auth/change-password" method="post">
        <label for="change-password">New password</label>
        <input type="password" id="change-password" name="password" required{% if error or success %} aria-describedby="change-password-{% if error %}error{% else %}success{% endif %}"{% endif %}>
        <label for="change-password-confirm">Confirm password</label>
        <input type="password" id="change-password-confirm" name="password_confirm" required{% if error or success %} aria-describedby="change-password-{% if error %}error{% else %}success{% endif %}"{% endif %}>
        <button type="submit">Update password</button>
    </form>
    <p><a href="/">Back to home</a></p>
{% endblock %}
