{% extends "base.html" %}

{% block content %}
    <h1>Log in with a magic link</h1>
    {% if error %}
        <p id="magic-link-error" class="auth-error" aria-live="polite" style="color: var(--color-destructive)">{{ error }}</p>
    {% endif %}
    <p>Enter your email and we'll send you a one-click login link.</p>
    <form action="/auth/magic-link" method="post">
        <label for="magic-link-email">Email</label>
        <input type="email" id="magic-link-email" name="email" required{% if error %} aria-describedby="magic-link-error"{% endif %}>
        <button type="submit">Send magic link</button>
    </form>
    <p><a href="/auth/login">Log in with password instead</a></p>
{% endblock %}
