<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrochetTracker</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preload" as="style" href="/static/styles.css">
    <link rel="stylesheet" href="/static/styles.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/styles.css"></noscript>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <img class="brand-mark" src="/static/logo.png" alt="CrochetTracker" width="64" height="64">
                <span>
                    <p class="brand-name">CrochetTracker</p>
                    <p class="brand-tag">A calmer way to plan every project</p>
                </span>
            </a>

            <nav class="nav-links">
                <a href="/">Overview</a>
                <a href="/projects/">Projects</a>
                <button type="button" id="stitch-reference-toggle" aria-expanded="false"
                    aria-controls="stitch-panel">Stitch reference</button>
                {% if user %}
                <form action="/auth/logout" method="post" style="display:inline">
                    <button type="submit">Log out</button>
                </form>
                {% else %}
                <a href="/auth/login">Log in</a>
                {% endif %}
            </nav>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="stitch-panel" hidden></div>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/stitch-panel.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
