<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrochetTracker</title>
    <link rel="icon" href="/static/favicon.ico">
    <!-- Inline critical styles as a fallback for environments where /static may be unavailable -->
    <style id="critical-styles">
        :root {
            --bg: #fcf5f1;
            --surface: #fffaf7;
            --surface-strong: #fff1e9;
            --text: #4f3040;
            --muted: #7a5d63;
            --accent: #c77b8f;
            --accent-strong: #a44f62;
            --accent-soft: #e9b79d;
            --border: #ead4cd;
            --shadow: 0 18px 45px rgba(112, 70, 80, 0.09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, var(--bg) 0%, #f8ece8 100%);
            color: var(--text);
        }

        a {
            color: var(--accent-strong);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .app-shell {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 250, 247, 0.95);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-weight: 700;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-soft), #f0c0c8);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .brand-mark svg {
            width: 32px;
            height: 32px;
        }

        .brand-name {
            margin: 0;
            font-size: 1.05rem;
        }

        .brand-tag {
            margin: 2px 0 0;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a,
        .nav-links button {
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-weight: 600;
        }

        .nav-links button {
            cursor: pointer;
        }

        .content {
            margin-top: 24px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .auth-layout {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 24px;
            align-items: stretch;
        }

        .auth-card,
        .auth-side {
            border-radius: 24px;
            padding: 30px;
        }

        .auth-card {
            background: linear-gradient(135deg, rgba(255, 250, 247, 0.96), rgba(255, 240, 232, 0.95));
            border: 1px solid var(--border);
        }

        .auth-layout-centered {
            display: flex;
            justify-content: center;
        }

        .auth-card-centered {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        .auth-card-centered .auth-form {
            text-align: left;
        }

        .auth-card-centered button[type="submit"] {
            margin: 0 auto;
        }

        .auth-side {
            background: linear-gradient(135deg, rgba(199, 123, 143, 0.16), rgba(233, 183, 157, 0.23));
            border: 1px solid rgba(199, 123, 143, 0.18);
        }

        .auth-badge {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--surface-strong);
            color: var(--accent-strong);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .auth-form {
            display: grid;
            gap: 14px;
            max-width: 100%;
            margin-top: 20px;
        }

        .auth-form label {
            display: grid;
            gap: 6px;
        }

        .auth-form input {
            margin-top: 0;
        }

        .auth-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .auth-error {
            margin: 12px 0 0;
            color: var(--accent-strong);
            font-weight: 600;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin: 18px 0 0;
            display: grid;
            gap: 12px;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 250, 247, 0.84);
            color: var(--text);
        }

        .feature-list li::before {
            content: "✿";
            color: var(--accent-strong);
            font-size: 1rem;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            align-items: center;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--surface-strong);
            color: var(--accent-strong);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.7rem, 2.3vw, 2.4rem);
            line-height: 1.2;
        }

        .lead {
            margin: 0;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .btn-outline {
            background: var(--surface-strong);
            color: var(--accent-strong);
            border-color: var(--border);
        }

        .stat-card {
            padding: 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(199, 123, 143, 0.16), rgba(233, 183, 157, 0.22));
            border: 1px solid rgba(199, 123, 143, 0.18);
        }

        .stat-card h2 {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        .stat-card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .subtle {
            color: var(--muted);
        }

        .project-section {
            margin-top: 24px;
        }

        .section-heading {
            margin-bottom: 12px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 1.3rem;
        }

        .project-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
            display: grid;
            gap: 12px;
        }

        .project-item {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface-strong);
        }

        form {
            display: grid;
            gap: 12px;
            max-width: 480px;
        }

        label {
            font-weight: 600;
        }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fffdfb;
            color: var(--text);
        }

        button[type="submit"] {
            width: fit-content;
            padding: 10px 16px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            .auth-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="8" width="48" height="48" rx="16" fill="#fff7f3" />
                        <path d="M22 44C22 30.8 30 21 32 21C34 21 42 30.8 42 44" stroke="#a44f62" stroke-width="5"
                            stroke-linecap="round" />
                        <path d="M24 20C24 20 24 15 29 15C34 15 34 20 34 20" stroke="#c77b8f" stroke-width="4"
                            stroke-linecap="round" />
                        <path d="M35 21C35 21 35 15 40 15C45 15 45 21 45 21" stroke="#c77b8f" stroke-width="4"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <span>
                    <p class="brand-name">CrochetTracker</p>
                    <p class="brand-tag">A calmer way to plan every project</p>
                </span>
            </a>

            <nav class="nav-links">
                <a href="/">Overview</a>
                <a href="/projects/">Projects</a>
                <button type="button" id="stitch-reference-toggle" aria-expanded="false"
                    aria-controls="stitch-panel">Stitch reference</button>
                {% if user %}
                <form action="/auth/logout" method="post" style="display:inline">
                    <button type="submit">Log out</button>
                </form>
                {% else %}
                <a href="/auth/login">Log in</a>
                {% endif %}
            </nav>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="stitch-panel" hidden></div>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/stitch-panel.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
