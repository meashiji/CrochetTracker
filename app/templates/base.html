<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrochetTracker</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="8" width="48" height="48" rx="16" fill="#fff7f3"/>
                        <path d="M22 44C22 30.8 30 21 32 21C34 21 42 30.8 42 44" stroke="#a44f62" stroke-width="5" stroke-linecap="round"/>
                        <path d="M24 20C24 20 24 15 29 15C34 15 34 20 34 20" stroke="#c77b8f" stroke-width="4" stroke-linecap="round"/>
                        <path d="M35 21C35 21 35 15 40 15C45 15 45 21 45 21" stroke="#c77b8f" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>
                    <p class="brand-name">CrochetTracker</p>
                    <p class="brand-tag">A calmer way to plan every project</p>
                </span>
            </a>

            <nav class="nav-links">
                <a href="/">Overview</a>
                <a href="/projects/">Projects</a>
                {% if user %}
                    <form action="/auth/logout" method="post" style="display:inline">
                        <button type="submit">Log out</button>
                    </form>
                {% else %}
                    <a href="/auth/login">Log in</a>
                {% endif %}
            </nav>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
